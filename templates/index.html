<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <title>気圧どうかな？</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic UI", sans-serif;
      background: linear-gradient(160deg, #1b1b2f, #16213e, #0f3460);
      color: white;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: rgba(20, 20, 20, 0.72);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .city {
      color: #cfcfcf;
      margin-top: 6px;
      font-size: 14px;
    }

    .summary {
      margin: 20px 0;
      padding: 16px;
      border-radius: 18px;
      font-weight: bold;
      color: #111;
      line-height: 1.5;
    }

    .normal { background: #95d5b2; }
    .caution { background: #ffd166; }
    .warning { background: #ff6b6b; }
    .danger { background: #ff4d6d; color: white; }

    .row {
      display: grid;
      grid-template-columns: 48px 42px 64px 88px 1fr;
      align-items: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .row.bad {
      background: rgba(255, 77, 109, 0.22);
      color: #ffb3c1;
      font-weight: bold;
    }

    .level {
      text-align: right;
      color: #bde0fe;
      font-weight: bold;
    }

    .bad .level {
      color: #ff4d6d;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      background: #bde0fe;
      color: #111;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>気圧どうかな？</h1>
    <div class="city" id="city">読み込み中...</div>

    <div class="summary normal" id="summary">取得中...</div>

    <div id="list"></div>

    <button onclick="loadData()">更新</button>
  </div>

  <script>
    async function loadData() {
      const res = await fetch("/api/kiatsu");
      const data = await res.json();

      document.getElementById("city").textContent =
        `${data.city} / ${data.updated}`;

      const summary = document.getElementById("summary");
      summary.textContent = data.summary;
      summary.className = `summary ${data.status}`;

      const list = document.getElementById("list");
      list.innerHTML = "";

      data.items.forEach(item => {
        const row = document.createElement("div");
        row.className = item.bad ? "row bad" : "row";

        row.innerHTML = `
          <div>${item.hour}時</div>
          <div>${item.weather}</div>
          <div>${item.temp}℃</div>
          <div>${item.pressure}hPa</div>
          <div class="level">${item.level}</div>
        `;

        list.appendChild(row);
      });
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/service-worker.js");
    }

    loadData();
  </script>
</body>
</html>
