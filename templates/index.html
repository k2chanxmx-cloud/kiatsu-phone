<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <title>気圧どうかな？</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic UI", sans-serif;
      background: linear-gradient(160deg, #1b1b2f, #16213e, #0f3460);
      color: white;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: rgba(20, 20, 20, 0.72);
      backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .city {
      color: #cfcfcf;
      margin-top: 6px;
      font-size: 14px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .tab {
      border: none;
      border-radius: 16px;
      padding: 12px 8px;
      font-size: 15px;
      font-weight: bold;
      background: rgba(255,255,255,0.12);
      color: white;
    }

    .tab.active {
      background: #bde0fe;
      color: #111;
    }

    .summary {
      margin: 20px 0;
      padding: 16px;
      border-radius: 18px;
      font-weight: bold;
      color: #111;
      line-height: 1.5;
      font-size: 17px;
    }

    .normal { background: #95d5b2; }
    .caution { background: #ffd166; }
    .warning { background: #ff6b6b; }
    .danger { background: #ff4d6d; color: white; }

    .row {
      display: grid;
      grid-template-columns: 78px 36px 68px 86px;
      align-items: center;
      gap: 6px;
      padding: 12px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .row.caution-row {
      background: rgba(255, 209, 102, 0.25);
      color: #ffe08a;
      font-weight: bold;
    }

    .row.bad {
      background: rgba(255, 77, 109, 0.22);
      color: #ffb3c1;
      font-weight: bold;
    }

    .chart-card {
      margin-top: 26px;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
    }

    .chart-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 260px;
    }

    button.refresh {
      width: 100%;
      margin-top: 16px;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      background: #bde0fe;
      color: #111;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>気圧どうかな？</h1>
    <div class="city" id="city">読み込み中...</div>

    <div class="tabs">
      <button class="tab active" id="tab-koto" onclick="changeArea('koto')">江東区</button>
      <button class="tab" id="tab-omotesando" onclick="changeArea('omotesando')">表参道</button>
    </div>

    <div class="summary normal" id="summary">取得中...</div>

    <div id="list"></div>

    <button class="refresh" onclick="loadData()">更新</button>

    <div class="chart-card">
      <div class="chart-title">気圧の推移</div>
      <div class="chart-wrap">
        <canvas id="pressureChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let currentArea = localStorage.getItem("selectedArea") || "koto";
    let pressureChart = null;

    function setActiveTab() {
      document.getElementById("tab-koto").classList.remove("active");
      document.getElementById("tab-omotesando").classList.remove("active");

      if (currentArea === "koto") {
        document.getElementById("tab-koto").classList.add("active");
      } else {
        document.getElementById("tab-omotesando").classList.add("active");
      }
    }

    function changeArea(area) {
      currentArea = area;
      localStorage.setItem("selectedArea", area);
      setActiveTab();
      loadData();
    }

    function drawPressureChart(labels, pressures) {
      const canvas = document.getElementById("pressureChart");

      if (pressureChart) {
        pressureChart.destroy();
      }

      pressureChart = new Chart(canvas, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "気圧 hPa",
            data: pressures,
            borderColor: "#bde0fe",
            backgroundColor: "rgba(189, 224, 254, 0.18)",
            borderWidth: 3,
            pointRadius: 3,
            pointHoverRadius: 5,
            tension: 0.35,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return `${context.parsed.y} hPa`;
                }
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: "#d7e3ff",
                maxRotation: 45,
                minRotation: 0
              },
              grid: {
                color: "rgba(255,255,255,0.08)"
              }
            },
            y: {
              ticks: {
                color: "#d7e3ff",
                callback: function(value) {
                  return value + "hPa";
                }
              },
              grid: {
                color: "rgba(255,255,255,0.08)"
              }
            }
          }
        }
      });
    }

    async function loadData() {
      const res = await fetch(`/api/kiatsu?area=${currentArea}`);
      const data = await res.json();

      document.getElementById("city").textContent =
        `${data.city} / ${data.updated}`;

      const summary = document.getElementById("summary");
      summary.textContent = data.summary;
      summary.className = `summary ${data.status}`;

      const list = document.getElementById("list");
      list.innerHTML = "";

      const graphLabels = [];
      const graphPressures = [];

      data.items.forEach(item => {
        const row = document.createElement("div");

        if (item.level_code === "3" || item.level_code === "4") {
          row.className = "row bad";
        } else if (item.level_code === "2") {
          row.className = "row caution-row";
        } else {
          row.className = "row";
        }

        row.innerHTML = `
          <div>${item.hour}</div>
          <div>${item.weather}</div>
          <div>${item.temp}℃</div>
          <div>${item.pressure}hPa</div>
        `;

        list.appendChild(row);

        const pressureValue = Number(item.pressure);
        if (!Number.isNaN(pressureValue)) {
          graphLabels.push(item.hour);
          graphPressures.push(pressureValue);
        }
      });

      drawPressureChart(graphLabels, graphPressures);
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/static/service-worker.js");
    }

    setActiveTab();
    loadData();
  </script>
</body>
</html>
